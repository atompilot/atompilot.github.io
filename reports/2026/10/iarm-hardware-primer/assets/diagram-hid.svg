<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">HID 报告表达此刻的输入状态</title><desc id="desc">按下、保持、移动与释放共同组成交互。这里不是可直接发送的协议字节；实际字段按相应 HID 描述符定义。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">HID 报告表达此刻的输入状态</text><rect x="25" y="110" width="160" height="105" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="105.0" y="157.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">按下</text><text x="105.0" y="187.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">左键 = 1</text><path d="M191,162 L213,162" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="220" y="110" width="160" height="105" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="300.0" y="157.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">移动</text><text x="300.0" y="187.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">左键 = 1</text><path d="M386,162 L408,162" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="415" y="110" width="160" height="105" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="495.0" y="157.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">松开</text><text x="495.0" y="187.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">左键 = 0</text><text x="300" y="270" fill="#087e83" font-size="23" font-weight="500" text-anchor="middle">移动时保持按住，最后明确松开</text><text x="300" y="309" fill="#d6663c" font-size="20" font-weight="500" text-anchor="middle">报告格式由设备描述符约定</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>