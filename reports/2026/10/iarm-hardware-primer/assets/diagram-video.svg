<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">帧率越高，需处理的图像通常越多</title><desc id="desc">算式使用每像素 2 字节的未压缩示例；MJPEG 为压缩形式，实际码率要看画面与设置，不套固定压缩倍数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">帧率越高，需处理的图像通常越多</text><rect x="30" y="95" width="115" height="93" rx="8" fill="#c8dce3" stroke="#456bc0"/><text x="88" y="151" fill="#456bc0" font-size="20" font-weight="500" text-anchor="middle">第 1 帧</text><rect x="170" y="95" width="115" height="93" rx="8" fill="#c8dce3" stroke="#456bc0"/><text x="228" y="151" fill="#456bc0" font-size="20" font-weight="500" text-anchor="middle">第 2 帧</text><rect x="310" y="95" width="115" height="93" rx="8" fill="#c8dce3" stroke="#456bc0"/><text x="368" y="151" fill="#456bc0" font-size="20" font-weight="500" text-anchor="middle">第 3 帧</text><rect x="450" y="95" width="115" height="93" rx="8" fill="#c8dce3" stroke="#456bc0"/><text x="508" y="151" fill="#456bc0" font-size="20" font-weight="500" text-anchor="middle">第 4 帧</text><text x="300" y="245" fill="#203b46" font-size="22" font-weight="500" text-anchor="middle">未压缩数据量 ≈ 宽 × 高 × 字节 × fps</text><text x="300" y="290" fill="#087e83" font-size="23" font-weight="500" text-anchor="middle">640 × 480 × 2 × 30 ≈ 18.43 MB/s</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>