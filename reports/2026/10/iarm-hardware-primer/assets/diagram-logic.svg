<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">同样传 0 和 1，也不一定能直接互接</title><desc id="desc">电平与电气标准的概念比较，不是电压阈值图或真实器件规格。按数据手册匹配接口和转换电路。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">同样传 0 和 1，也不一定能直接互接</text><rect x="20" y="97" width="165" height="100" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="102.5" y="142.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">3.3 V 逻辑</text><text x="102.5" y="172.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">示例低 / 高</text><rect x="218" y="97" width="165" height="100" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="300.5" y="142.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">5 V 逻辑</text><text x="300.5" y="172.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">规格需匹配</text><rect x="415" y="97" width="165" height="100" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="497.5" y="142.0" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">RS-232</text><text x="497.5" y="172.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">不同电气规则</text><text x="300" y="259" fill="#203b46" font-size="22" font-weight="500" text-anchor="middle">名字都叫“串口”，电气条件可能不同</text><text x="300" y="309" fill="#d6663c" font-size="20" font-weight="500" text-anchor="middle">传统 RS-232 正负电压不能直接接 GPIO</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>