<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">一字节数据，线路还需标记开始结束</title><desc id="desc">波形是 8N1 结构示意：空闲高、起始位低、8 个数据位、停止位高。图中位值仅为示例，不是某条芯片命令。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">一字节数据，线路还需标记开始结束</text><text x="34" y="90" fill="#087e83" font-size="21" font-weight="500" text-anchor="start">TX</text><path d="M70 130 H70 V130 H110 H110 V205 H150 H150 V130 H190 H190 V205 H230 H230 V205 H270 H270 V205 H310 H310 V205 H350 H350 V205 H390 H390 V130 H430 H430 V205 H470 H470 V130 H510 H510 V130 H550" fill="none" stroke="#087e83" stroke-width="4"/><text x="90" y="252" fill="#203b46" font-size="17" font-weight="500" text-anchor="middle">空闲</text><text x="130" y="281" fill="#d6663c" font-size="18" font-weight="500" text-anchor="middle">起始</text><text x="310" y="252" fill="#456bc0" font-size="22" font-weight="500" text-anchor="middle">8 个数据位</text><text x="490" y="281" fill="#d6663c" font-size="18" font-weight="500" text-anchor="middle">停止</text><text x="300" y="313" fill="#203b46" font-size="20" font-weight="500" text-anchor="middle">8N1：8 位数据、无校验、1 位停止位</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>