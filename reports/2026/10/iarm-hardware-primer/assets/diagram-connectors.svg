<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">先认外形，再确认功能</title><desc id="desc">USB-A、USB-C 和 Lightning 的外形示意，不是针脚图。蓝色舌片仅用于区分轮廓，不据此判断具体线缆能力。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">先认外形，再确认功能</text><rect x="35" y="102" width="130" height="68" rx="5" fill="#d5dfe1" stroke="#203b46" stroke-width="3"/><rect x="48" y="116" width="104" height="39" fill="#365b72"/><text x="100" y="222" fill="#087e83" font-size="24" font-weight="650" text-anchor="middle">USB-A</text><rect x="237" y="110" width="126" height="49" rx="24" fill="#d5dfe1" stroke="#203b46" stroke-width="3"/><rect x="255" y="130" width="90" height="9" rx="4" fill="#365b72"/><text x="300" y="222" fill="#087e83" font-size="24" font-weight="650" text-anchor="middle">USB-C</text><rect x="458" y="95" width="84" height="85" rx="13" fill="#ddd7c5" stroke="#203b46" stroke-width="3"/><rect x="469" y="116" width="5" height="37" rx="2" fill="#c59b49"/><rect x="478" y="116" width="5" height="37" rx="2" fill="#c59b49"/><rect x="487" y="116" width="5" height="37" rx="2" fill="#c59b49"/><rect x="496" y="116" width="5" height="37" rx="2" fill="#c59b49"/><rect x="505" y="116" width="5" height="37" rx="2" fill="#c59b49"/><rect x="514" y="116" width="5" height="37" rx="2" fill="#c59b49"/><rect x="523" y="116" width="5" height="37" rx="2" fill="#c59b49"/><rect x="532" y="116" width="5" height="37" rx="2" fill="#c59b49"/><text x="500" y="222" fill="#087e83" font-size="24" font-weight="650" text-anchor="middle">Lightning</text><text x="300" y="281" fill="#d6663c" font-size="23" font-weight="500" text-anchor="middle">外形 ≠ 协议 / 速度 / 主从角色</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>