<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">元件符号，表达不同的电气作用</title><desc id="desc">电阻、电容、LED 的概念符号；这不是完整、可上电的电路。LED 一般需按条件限流并核对极性。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">元件符号，表达不同的电气作用</text><path d="M40,125 L105,125" stroke="#d6663c" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><path d="M110 125 L122 107 L141 143 L160 107 L179 143 L198 107 L210 125 H260" stroke="#203b46" stroke-width="3" fill="none"/><text x="159" y="193" fill="#203b46" font-size="21" font-weight="500" text-anchor="middle">电阻：限制电流</text><path d="M375 92 V160 M399 92 V160 M326 125 H375 M399 125 H450" stroke="#203b46" stroke-width="4"/><text x="400" y="193" fill="#203b46" font-size="21" font-weight="500" text-anchor="middle">电容：储存电荷</text><path d="M225 267 H260 L285 249 V285 L260 267 M285 249 V285 M285 267 H325" stroke="#087e83" stroke-width="3" fill="none"/><path d="M288,239 L312,218" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><path d="M302,249 L326,228" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="370" y="276" fill="#087e83" font-size="21" font-weight="500" text-anchor="middle">LED：发光</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>