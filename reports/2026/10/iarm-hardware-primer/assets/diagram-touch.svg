<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">鼠标位置，不等于多个触摸点</title><desc id="desc">只是不同输入模型的概念对照，不表示 iPhone 接受某个外部触摸屏报告。要按具体芯片报告与系统逐项验证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">鼠标位置，不等于多个触摸点</text><rect x="65" y="83" width="190" height="215" rx="18" fill="white" stroke="#203b46" stroke-width="3"/><rect x="125.80000000000001" y="91" width="68.39999999999999" height="5" rx="2" fill="#203b46"/><rect x="345" y="83" width="190" height="215" rx="18" fill="white" stroke="#203b46" stroke-width="3"/><rect x="405.8" y="91" width="68.39999999999999" height="5" rx="2" fill="#203b46"/><circle cx="155" cy="171" r="15" fill="#456bc0"/><circle cx="403" cy="165" r="16" fill="#087e83"/><circle cx="477" cy="216" r="16" fill="#087e83"/><text x="160" y="328" fill="#456bc0" font-size="23" font-weight="500" text-anchor="middle">一个鼠标指针</text><text x="440" y="328" fill="#087e83" font-size="23" font-weight="500" text-anchor="middle">两个触摸点</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>