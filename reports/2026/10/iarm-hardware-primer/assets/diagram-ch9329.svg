<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">串口转 HID，和 USB 转串口分工不同</title><desc id="desc">CH9329 系列以串口命令驱动 USB HID 设备功能。图为功能分工，不表示芯片封装、模块接线或 iPhone 已兼容；F 型号额外能力另核对。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">串口转 HID，和 USB 转串口分工不同</text><rect x="20" y="102" width="150" height="98" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="95.0" y="146.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">控制端</text><text x="95.0" y="176.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">发送串口命令</text><rect x="227" y="102" width="150" height="98" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="302.0" y="146.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">CH9329 系列</text><text x="302.0" y="176.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">转换成 HID</text><rect x="434" y="102" width="146" height="98" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="507.0" y="146.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">手机主机</text><text x="507.0" y="176.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">接收 USB 输入</text><path d="M177,150 L220,150" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><path d="M384,150 L427,150" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="195" y="243" fill="#456bc0" font-size="23" font-weight="500" text-anchor="middle">UART</text><text x="405" y="243" fill="#087e83" font-size="23" font-weight="500" text-anchor="middle">USB</text><text x="300" y="302" fill="#d6663c" font-size="20" font-weight="500" text-anchor="middle">普通型号与 F 型号的额外能力分别看</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>