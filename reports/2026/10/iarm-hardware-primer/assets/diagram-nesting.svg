<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">芯片、模组、开发板，三层关系</title><desc id="desc">功能从芯片向外扩展到模组，再到方便连接的开发板。不同板型并不拥有相同插座去向或针脚布局。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">芯片、模组、开发板，三层关系</text><rect x="35" y="70" width="530" height="230" rx="15" fill="#dcebe0" stroke="#087e83" stroke-width="3"/><text x="60" y="103" fill="#087e83" font-size="22" font-weight="500" text-anchor="start">开发板：USB、稳压器、按钮、排针…</text><rect x="95" y="129" width="410" height="143" rx="13" fill="#e4e9ec" stroke="#456bc0" stroke-width="3"/><text x="115" y="161" fill="#456bc0" font-size="21" font-weight="500" text-anchor="start">模组：芯片 + 存储 / 射频等</text><rect x="191" y="185" width="220" height="60" rx="9" fill="#526b76"/><text x="300" y="224" fill="#fff" font-size="23" font-weight="500" text-anchor="middle">核心芯片 / MCU</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>