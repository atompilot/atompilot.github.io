<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">图像格式与文档格式，各有用途</title><desc id="desc">本教程用 SVG 画概念图，用网页提供交互。另存 PDF 主要保存可打印内容，不能期待网页弹层继续工作。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">图像格式与文档格式，各有用途</text><rect x="25" y="100" width="240" height="100" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="145.0" y="145.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">SVG</text><text x="145.0" y="175.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">线条、图形与文字</text><rect x="335" y="100" width="240" height="100" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="455.0" y="145.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">PDF</text><text x="455.0" y="175.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">保存打印版式</text><text x="300" y="261" fill="#203b46" font-size="22" font-weight="500" text-anchor="middle">网页可交互；打印保存文字与图解</text><text x="300" y="306" fill="#d6663c" font-size="20" font-weight="500" text-anchor="middle">此图只是格式用途示意</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>