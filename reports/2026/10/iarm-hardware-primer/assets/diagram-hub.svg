<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Hub 扩展下游，不增加主机</title><desc id="desc">多个设备经 Hub 连接同一主机，共享相应带宽、供电及控制器资源。它不能让 S3 同时成为相机的主机和手机的 USB 键盘。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">Hub 扩展下游，不增加主机</text><rect x="25" y="156" width="135" height="76" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="92.5" y="202.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">一个主机</text><rect x="230" y="156" width="130" height="76" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="295.0" y="202.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">Hub</text><path d="M165,194 L225,194" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="447" y="70" width="128" height="66" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="511.0" y="111.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">相机</text><path d="M365,194 L440,103" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="447" y="160" width="128" height="66" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="511.0" y="201.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">键盘</text><path d="M365,194 L440,193" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="447" y="250" width="128" height="66" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="511.0" y="291.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">鼠标</text><path d="M365,194 L440,283" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="288" y="306" fill="#d6663c" font-size="19" font-weight="500" text-anchor="middle">多路共享同一主机的资源</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>