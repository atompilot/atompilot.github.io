<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">相机输出协议不同，接法也不同</title><desc id="desc">三行是不同路线，不是把三种相机同时接到一块 S3。MIPI、DVP 与 USB 不能靠一条被动尾线任意转换。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">相机输出协议不同，接法也不同</text><rect x="20" y="75" width="175" height="62" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="107.5" y="114.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">USB 相机</text><rect x="391" y="75" width="190" height="62" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="486.0" y="114.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">USB Host</text><path d="M202,106 L384,106" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="20" y="163" width="175" height="62" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="107.5" y="202.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">DVP 相机</text><rect x="391" y="163" width="190" height="62" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="486.0" y="202.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">并行采集外设</text><path d="M202,194 L384,194" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="292" y="177" fill="#087e83" font-size="18" font-weight="500" text-anchor="middle">多根信号</text><rect x="20" y="251" width="175" height="62" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="107.5" y="290.0" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">MIPI 相机</text><rect x="391" y="251" width="190" height="62" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="486.0" y="290.0" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">相应 CSI-2 接口</text><path d="M202,282 L384,282" stroke="#d6663c" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>