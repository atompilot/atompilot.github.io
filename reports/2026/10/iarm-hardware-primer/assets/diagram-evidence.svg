<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">数据发出，不等于手机已经完成</title><desc id="desc">用于理解回执、执行效果和端到端检查。观察一个中间层成功，不能自动宣称最后的手机输入成功。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">数据发出，不等于手机已经完成</text><rect x="20" y="110" width="165" height="100" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="102.5" y="155.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">发出</text><text x="102.5" y="185.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">电脑写入</text><path d="M189,160 L211,160" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="217" y="110" width="165" height="100" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="299.5" y="155.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">接收</text><text x="299.5" y="185.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">芯片回执</text><path d="M386,160 L408,160" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="414" y="110" width="165" height="100" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="496.5" y="155.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">效果</text><text x="496.5" y="185.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">手机变化</text><text x="300" y="270" fill="#d6663c" font-size="24" font-weight="500" text-anchor="middle">每一层，只证明这一层的事实</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>