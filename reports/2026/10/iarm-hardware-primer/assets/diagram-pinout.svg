<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">距离、编号与功能，三个问题</title><desc id="desc">针距表示相邻接点中心间距；线序表示各位置的功能。图中没有给出真实电压或实际相机的针距，需查准确型号。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">距离、编号与功能，三个问题</text><rect x="106" y="110" width="18" height="80" fill="#b88e3d"/><text x="115" y="226" fill="#203b46" font-size="21" font-weight="500" text-anchor="middle">针 1</text><rect x="226" y="110" width="18" height="80" fill="#b88e3d"/><text x="235" y="226" fill="#203b46" font-size="21" font-weight="500" text-anchor="middle">针 2</text><rect x="346" y="110" width="18" height="80" fill="#b88e3d"/><text x="355" y="226" fill="#203b46" font-size="21" font-weight="500" text-anchor="middle">针 3</text><rect x="466" y="110" width="18" height="80" fill="#b88e3d"/><text x="475" y="226" fill="#203b46" font-size="21" font-weight="500" text-anchor="middle">针 4</text><path d="M115,82 L235,82" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#start)" /><text x="175" y="63" fill="#456bc0" font-size="21" font-weight="500" text-anchor="middle">针距</text><text x="300" y="277" fill="#d6663c" font-size="23" font-weight="500" text-anchor="middle">线序：每一针分别是什么功能？</text><text x="300" y="311" fill="#203b46" font-size="20" font-weight="500" text-anchor="middle">针数与外壳相似，也不能猜线序</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>