<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">一对数据线，与供电和地分开看</title><desc id="desc">只示意 USB 常见数据线对与供电、地的不同职责，不是某种连接器的物理针序；不是 UART 的 TX/RX 交叉接法。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">一对数据线，与供电和地分开看</text><rect x="15" y="86" width="125" height="226" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="77.5" y="207.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">USB 端 A</text><rect x="460" y="86" width="125" height="226" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="522.5" y="207.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">USB 端 B</text><path d="M148,118 L452,118" stroke="#d6663c" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#start)" /><text x="300" y="106" fill="#d6663c" font-size="20" font-weight="500" text-anchor="middle">供电</text><path d="M148,168 L452,168" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#start)" /><text x="300" y="156" fill="#087e83" font-size="20" font-weight="500" text-anchor="middle">D+</text><path d="M148,218 L452,218" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#start)" /><text x="300" y="206" fill="#456bc0" font-size="20" font-weight="500" text-anchor="middle">D−</text><path d="M148,268 L452,268" stroke="#203b46" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#start)" /><text x="300" y="256" fill="#203b46" font-size="20" font-weight="500" text-anchor="middle">GND</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>