<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">用对应点，把两个平面位置联系起来</title><desc id="desc">四角标定可用于建立平面透视映射。概念图没有证明某个 HID 报告范围或你的相机已标定成功。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">用对应点，把两个平面位置联系起来</text><rect x="25" y="83" width="235" height="208" rx="9" fill="#dce5e7"/><polygon points="82,108 235,140 204,264 51,226" fill="white" stroke="#456bc0" stroke-width="3"/><circle cx="82" cy="108" r="7" fill="#d6663c"/><circle cx="235" cy="140" r="7" fill="#d6663c"/><circle cx="204" cy="264" r="7" fill="#d6663c"/><circle cx="51" cy="226" r="7" fill="#d6663c"/><path d="M274,187 L327,187" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="369" y="83" width="182" height="208" rx="18" fill="white" stroke="#203b46" stroke-width="3"/><rect x="427.24" y="91" width="65.52" height="5" rx="2" fill="#203b46"/><text x="143" y="318" fill="#456bc0" font-size="22" font-weight="500" text-anchor="middle">相机里的四角</text><text x="460" y="318" fill="#087e83" font-size="22" font-weight="500" text-anchor="middle">屏幕坐标</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>