<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">短路：不该直接相通的点形成通路</title><desc id="desc">这里只说明有负载与意外低阻通路的区别，不是完整电源电路。测量时避免表笔打滑或把电流档跨接电源两极。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">短路：不该直接相通的点形成通路</text><rect x="25" y="80" width="180" height="88" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="115.0" y="119.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">有负载的路径</text><text x="115.0" y="149.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">电流按条件流过</text><rect x="396" y="80" width="180" height="88" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="486.0" y="119.0" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">意外短路</text><text x="486.0" y="149.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">出现低阻通路</text><path d="M65 190 H165 V275 H65 Z" stroke="#087e83" stroke-width="4" fill="none"/><rect x="125" y="222" width="70" height="20" fill="white" stroke="#087e83" stroke-width="3"/><path d="M436 190 H536 V275 H436 Z" stroke="#d6663c" stroke-width="5" fill="none"/><text x="115" y="313" fill="#203b46" font-size="19" font-weight="500" text-anchor="middle">图形示意</text><text x="487" y="313" fill="#d6663c" font-size="18" font-weight="500" text-anchor="middle">切勿尝试并接电源</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>