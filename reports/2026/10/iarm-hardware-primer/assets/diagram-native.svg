<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">独立桥与原生 USB，走不同路径</title><desc id="desc">带桥接芯片的板子可让桥接芯片处理电脑通信，原生 USB 分工处理其他角色。芯片内部 USB Serial/JTAG 与 OTG 的 PHY 共享需另行核对。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">独立桥与原生 USB，走不同路径</text><rect x="20" y="76" width="160" height="68" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="100.0" y="105.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">独立串口桥</text><text x="100.0" y="135.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">另一颗芯片</text><rect x="362" y="76" width="215" height="68" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="469.5" y="105.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">S3 的 UART</text><text x="469.5" y="135.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">接收命令 / 打印日志</text><path d="M185,110 L354,110" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="270" y="93" fill="#456bc0" font-size="18" font-weight="500" text-anchor="middle">串口信号</text><rect x="20" y="205" width="160" height="68" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="100.0" y="247.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">原生 USB 口</text><rect x="362" y="205" width="215" height="68" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="469.5" y="234.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">S3 USB OTG</text><text x="469.5" y="264.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">Host 或 Device</text><path d="M185,239 L354,239" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="270" y="221" fill="#087e83" font-size="18" font-weight="500" text-anchor="middle">USB 信号</text><text x="300" y="311" fill="#d6663c" font-size="20" font-weight="500" text-anchor="middle">两条路径；不是“有两口就能任意两用”</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>