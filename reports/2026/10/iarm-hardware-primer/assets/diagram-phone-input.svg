<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">系统设置与外部输入的关系</title><desc id="desc">手机图是概念轮廓，不是 iOS 设置截图。辅助触控用于相应指针路径，键盘和开发者模式属于不同设置与用途。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">系统设置与外部输入的关系</text><rect x="230" y="74" width="140" height="228" rx="18" fill="white" stroke="#203b46" stroke-width="3"/><rect x="274.8" y="82" width="50.4" height="5" rx="2" fill="#203b46"/><rect x="20" y="115" width="150" height="68" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="95.0" y="157.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">外部鼠标</text><rect x="430" y="115" width="150" height="68" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="505.0" y="144.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">外部键盘</text><text x="505.0" y="174.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">需系统支持</text><path d="M174,150 L223,150" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><path d="M423,150 L377,150" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><circle cx="299" cy="194" r="18" fill="#bcc9cc" stroke="#203b46"/><text x="300" y="261" fill="#203b46" font-size="20" font-weight="500" text-anchor="middle">屏幕指针</text><text x="300" y="325" fill="#d6663c" font-size="18" font-weight="500" text-anchor="middle">辅助触控、键盘导航与开发调试分别看</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>