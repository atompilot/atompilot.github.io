<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">两种内部功能，共用一个物理收发部分</title><desc id="desc">S3 的内部 PHY 共享关系示意，没有画全部芯片结构或外部 PHY 方案。加外部 PHY 不表示增加第二个可任意 Host/Device 的 OTG 控制器。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">两种内部功能，共用一个物理收发部分</text><rect x="20" y="78" width="205" height="72" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="122.5" y="122.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">USB OTG</text><rect x="20" y="220" width="205" height="72" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="122.5" y="251.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">USB Serial/JTAG</text><text x="122.5" y="281.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">固定调试功能</text><rect x="308" y="141" width="125" height="87" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="370.5" y="192.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">内部 PHY</text><rect x="480" y="141" width="100" height="87" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="530.0" y="192.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">USB 线</text><path d="M230,115 L302,171" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><path d="M230,255 L302,200" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><path d="M438,185 L473,185" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="300" y="323" fill="#d6663c" font-size="19" font-weight="500" text-anchor="middle">内部 PHY 是共享资源，不是两套独立接口</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>