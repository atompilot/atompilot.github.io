<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">测量前，先确认档位与插孔</title><desc id="desc">电压和通断是不同测量方式；电流测量通常需要串入电路。按实际表具说明操作，本图不表示表笔已插到正确实物位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">测量前，先确认档位与插孔</text><rect x="30" y="85" width="220" height="120" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="140.0" y="140.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">测电压</text><text x="140.0" y="170.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">表跨在两点之间</text><rect x="350" y="85" width="220" height="120" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="460.0" y="140.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">测通断</text><text x="460.0" y="170.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">先断电再检查</text><text x="140" y="258" fill="#456bc0" font-size="22" font-weight="500" text-anchor="middle">选择 V 直流档</text><text x="460" y="258" fill="#087e83" font-size="22" font-weight="500" text-anchor="middle">确认是否导通</text><text x="300" y="304" fill="#d6663c" font-size="21" font-weight="500" text-anchor="middle">不要用电流档直接跨接电源两极</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>