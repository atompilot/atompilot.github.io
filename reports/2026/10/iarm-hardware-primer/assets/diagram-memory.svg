<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">储物柜与工作桌，不是同一种容量</title><desc id="desc">N8R2 / N16R8 这里分别标 Flash 与 PSRAM 容量；PSRAM 不是芯片全部运行内存，也不直接让 CPU 变快。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">储物柜与工作桌，不是同一种容量</text><rect x="25" y="88" width="170" height="123" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="110.0" y="144.5" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">Flash</text><text x="110.0" y="174.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">断电保留固件</text><rect x="215" y="88" width="170" height="123" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="300.0" y="144.5" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">SRAM</text><text x="300.0" y="174.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">片内工作空间</text><rect x="405" y="88" width="170" height="123" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="490.0" y="144.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">PSRAM</text><text x="490.0" y="174.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">额外工作空间</text><text x="300" y="264" fill="#203b46" font-size="24" font-weight="500" text-anchor="middle">N8R2：8 MB + 2 MB</text><text x="300" y="304" fill="#203b46" font-size="24" font-weight="500" text-anchor="middle">N16R8：16 MB + 8 MB</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>