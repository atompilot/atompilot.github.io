<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">同一部手机，两种 USB 角色</title><desc id="desc">接电脑时手机通常是设备；接有线鼠标时，手机需要作为主机。能否连接取决于手机、转接器、供电和设备兼容。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">同一部手机，两种 USB 角色</text><rect x="30" y="77" width="150" height="73" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="105.0" y="108.5" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">Mac</text><text x="105.0" y="138.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">主机</text><rect x="415" y="77" width="150" height="73" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="490.0" y="108.5" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">手机</text><text x="490.0" y="138.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">设备</text><path d="M185,115 L405,115" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#start)" /><text x="300" y="92" fill="#456bc0" font-size="19" font-weight="500" text-anchor="middle">连接电脑</text><rect x="30" y="205" width="150" height="73" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="105.0" y="236.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">手机</text><text x="105.0" y="266.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">主机</text><rect x="415" y="205" width="150" height="73" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="490.0" y="236.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">鼠标</text><text x="490.0" y="266.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">设备</text><path d="M185,243 L405,243" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#start)" /><text x="300" y="220" fill="#087e83" font-size="19" font-weight="500" text-anchor="middle">连接外设</text><text x="300" y="314" fill="#d6663c" font-size="22" font-weight="500" text-anchor="middle">重点是角色，不是插头的名字</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>