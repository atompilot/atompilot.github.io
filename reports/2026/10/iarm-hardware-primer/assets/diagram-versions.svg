<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">固定版本和 latest，不是同一个入口</title><desc id="desc">文档地址或软件版本的示意，不是新版本优劣比较。实验复现需要记录准确版本；latest 页面会随更新变化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">固定版本和 latest，不是同一个入口</text><rect x="25" y="90" width="240" height="122" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="145.0" y="146.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">固定版本</text><text x="145.0" y="176.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">例如 v5.3.1</text><rect x="335" y="90" width="240" height="122" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="455.0" y="146.0" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">latest</text><text x="455.0" y="176.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">随维护继续变化</text><text x="300" y="271" fill="#087e83" font-size="23" font-weight="500" text-anchor="middle">复现实验：固定实际使用的版本</text><text x="300" y="313" fill="#203b46" font-size="20" font-weight="500" text-anchor="middle">阅读当前概览：留意资料的核查日期</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>