<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">图像是一格格像素的数据</title><desc id="desc">小网格只是示意；RGB24 常按每像素 3 字节计算。分辨率表示网格宽高，不自动代表对焦与识字质量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">图像是一格格像素的数据</text><rect x="30" y="85" width="24" height="24" fill="#8ebbc3"/><rect x="55" y="85" width="24" height="24" fill="#e4ab8d"/><rect x="80" y="85" width="24" height="24" fill="#d7dec2"/><rect x="105" y="85" width="24" height="24" fill="#aac0e6"/><rect x="130" y="85" width="24" height="24" fill="#8ebbc3"/><rect x="155" y="85" width="24" height="24" fill="#e4ab8d"/><rect x="180" y="85" width="24" height="24" fill="#d7dec2"/><rect x="205" y="85" width="24" height="24" fill="#aac0e6"/><rect x="30" y="110" width="24" height="24" fill="#e4ab8d"/><rect x="55" y="110" width="24" height="24" fill="#d7dec2"/><rect x="80" y="110" width="24" height="24" fill="#aac0e6"/><rect x="105" y="110" width="24" height="24" fill="#8ebbc3"/><rect x="130" y="110" width="24" height="24" fill="#e4ab8d"/><rect x="155" y="110" width="24" height="24" fill="#d7dec2"/><rect x="180" y="110" width="24" height="24" fill="#aac0e6"/><rect x="205" y="110" width="24" height="24" fill="#8ebbc3"/><rect x="30" y="135" width="24" height="24" fill="#d7dec2"/><rect x="55" y="135" width="24" height="24" fill="#aac0e6"/><rect x="80" y="135" width="24" height="24" fill="#8ebbc3"/><rect x="105