<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">供电 5 V，不等于信号可输入 5 V</title><desc id="desc">示意开发板把供电转换为芯片所需电压；另一条路径是数字信号。普通 GPIO 不承担大电流负载供电。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">供电 5 V，不等于信号可输入 5 V</text><rect x="22" y="80" width="135" height="77" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="89.5" y="126.5" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">5 V 电源</text><rect x="228" y="80" width="145" height="77" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="300.5" y="126.5" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">稳压器</text><rect x="444" y="80" width="135" height="77" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="511.5" y="126.5" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">3.3 V 芯片</text><path d="M163,119 L222,119" stroke="#d6663c" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><path d="M379,119 L438,119" stroke="#d6663c" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="65" y="218" width="176" height="69" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="153.0" y="260.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">3.3 V 信号</text><rect x="365" y="218" width="176" height="69" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="453.0" y="260.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">GPIO 输入</text><path d="M246,252 L359,252" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="300" y="202" fill="#087e83" font-size="21" font-weight="500" text-anchor="middle">供电路径与信号路径分开看</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>