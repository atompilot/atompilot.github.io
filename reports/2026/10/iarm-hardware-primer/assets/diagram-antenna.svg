<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">板载天线与外接天线连接器</title><desc id="desc">外形为概念插画，不是连接器型号图。具体射频接口、匹配天线与板上切换方式以模组资料为准，不保证外接信号更好。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">板载天线与外接天线连接器</text><rect x="25" y="80" width="250" height="180" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="150.0" y="178.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle"></text><rect x="325" y="80" width="250" height="180" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="450.0" y="178.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle"></text><path d="M70 130 H110 V170 H150 V130 H190 V170 H230" fill="none" stroke="#b58b39" stroke-width="8"/><circle cx="450" cy="151" r="22" fill="#d5be87" stroke="#203b46" stroke-width="3"/><circle cx="450" cy="151" r="8" fill="#203b46"/><path d="M450 130 C450 70 540 75 540 50" stroke="#203b46" stroke-width="4" fill="none"/><text x="150" y="226" fill="#087e83" font-size="22" font-weight="500" text-anchor="middle">板上铜线天线</text><text x="450" y="226" fill="#087e83" font-size="22" font-weight="500" text-anchor="middle">接口 + 外部天线</text><text x="300" y="311" fill="#d6663c" font-size="21" font-weight="500" text-anchor="middle">插座不是天线本体，具体型号需匹配</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不