<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">移动增量与目标坐标分开看</title><desc id="desc">相对输入表示移动多少；绝对输入表示约定范围内的目标坐标。两者都需验证手机解释方式，不等同于直接触屏。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">移动增量与目标坐标分开看</text><rect x="55" y="76" width="190" height="215" rx="18" fill="white" stroke="#203b46" stroke-width="3"/><rect x="115.80000000000001" y="84" width="68.39999999999999" height="5" rx="2" fill="#203b46"/><rect x="355" y="76" width="190" height="215" rx="18" fill="white" stroke="#203b46" stroke-width="3"/><rect x="415.8" y="84" width="68.39999999999999" height="5" rx="2" fill="#203b46"/><path d="M116,194 L202,194" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="150" y="319" fill="#087e83" font-size="23" font-weight="500" text-anchor="middle">相对：右移一段</text><text x="450" y="319" fill="#456bc0" font-size="23" font-weight="500" text-anchor="middle">绝对：目标位置</text><circle cx="462" cy="155" r="9" fill="#456bc0"/><path d="M440 155 H485 M462 132 V178" stroke="#456bc0" stroke-width="2"/><text x="450" y="224" fill="#456bc0" font-size="23" font-weight="500" text-anchor="middle">(x, y)</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>