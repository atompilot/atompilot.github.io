<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">上层调用、电脑驱动与板上固件</title><desc id="desc">三层职责示意；固件运行在板上，电脑程序负责与设备通信。存在一个 API 名字不代表底层已经实现。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">上层调用、电脑驱动与板上固件</text><rect x="160" y="70" width="280" height="62" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="300.0" y="96.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">API</text><text x="300.0" y="126.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">上层调用入口</text><path d="M300,134 L300,149" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="160" y="153" width="280" height="62" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="300.0" y="179.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">驱动</text><text x="300.0" y="209.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">理解设备命令</text><path d="M300,217 L300,232" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="160" y="236" width="280" height="62" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="300.0" y="262.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">固件</text><text x="300.0" y="292.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">芯片上执行</text><text x="300" y="323" fill="#d6663c" font-size="21" font-weight="500" text-anchor="middle">代码在哪运行，决定它负责哪一段</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>