<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">把同一电压轨的电流预算相加</title><desc id="desc">示例数值用于理解单位和计算，不代表你的设备功耗。不同电压轨、启动峰值、转换损耗与线缆压降另行核算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">把同一电压轨的电流预算相加</text><rect x="30" y="93" width="125" height="85" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="92.5" y="130.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">一个模块</text><text x="92.5" y="160.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">示例 0.3 A</text><rect x="175" y="93" width="125" height="85" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="237.5" y="130.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">一个模块</text><text x="237.5" y="160.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">示例 0.3 A</text><rect x="320" y="93" width="125" height="85" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="382.5" y="130.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">一个模块</text><text x="382.5" y="160.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">示例 0.3 A</text><rect x="465" y="93" width="125" height="85" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="527.5" y="130.5" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">一个模块</text><text x="527.5" y="160.5" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">示例 0.3 A</text><text x="300" y="231" fill="#087e83" font-size="30" font-weight="650" text-anchor="middle">4 × 0.3 A = 1.2 A</text><text x="300" y="280" fill="#d6663c" font-size="29" font-weight="650" text-anchor="middle">5 V × 1.2 A = 6 W</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>