<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">C-to-C，就是两头都是 USB-C</title><desc id="desc">接口外形示意。数据线、角色配置、速率及供电能力仍要确认；不能只看两个插头相同就任意连接板子。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">C-to-C，就是两头都是 USB-C</text><rect x="45" y="120" width="120" height="55" rx="27" fill="#d7e0e2" stroke="#203b46" stroke-width="3"/><rect x="435" y="120" width="120" height="55" rx="27" fill="#d7e0e2" stroke="#203b46" stroke-width="3"/><path d="M165 147 C235 80 365 215 435 147" stroke="#365b72" stroke-width="15" fill="none"/><text x="105" y="223" fill="#087e83" font-size="22" font-weight="500" text-anchor="middle">USB-C 插头</text><text x="495" y="223" fill="#087e83" font-size="22" font-weight="500" text-anchor="middle">USB-C 插头</text><text x="300" y="289" fill="#d6663c" font-size="21" font-weight="500" text-anchor="middle">两头的形状相同，不代表全部能力相同</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>