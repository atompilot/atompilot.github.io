<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">数据主从与供受电，是两组角色</title><desc id="desc">合适的连接方案可让手机在 USB 数据上作为主机，同时接受外部电源。它不是普通 Y 线并接两根电源，实际兼容性要确认。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">数据主从与供受电，是两组角色</text><rect x="240" y="85" width="125" height="180" rx="18" fill="white" stroke="#203b46" stroke-width="3"/><rect x="280.0" y="93" width="45.0" height="5" rx="2" fill="#203b46"/><rect x="15" y="110" width="165" height="74" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="97.5" y="142.0" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">充电器</text><text x="97.5" y="172.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">供电一侧</text><rect x="425" y="110" width="160" height="74" rx="13" fill="white" stroke="#456bc0" stroke-width="2"/><text x="505.0" y="142.0" fill="#456bc0" font-size="22" font-weight="650" text-anchor="middle">鼠标</text><text x="505.0" y="172.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">数据设备</text><path d="M185,147 L232,147" stroke="#d6663c" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><path d="M415,147 L372,147" stroke="#456bc0" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#start)" /><text x="300" y="289" fill="#087e83" font-size="22" font-weight="500" text-anchor="middle">手机可同时：接收电源 + 主持数据</text><text x="300" y="320" fill="#d6663c" font-size="20" font-weight="500" text-anchor="middle">需相容的扩展器与供电协商</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>