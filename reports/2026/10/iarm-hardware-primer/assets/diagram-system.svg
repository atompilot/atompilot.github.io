<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 335" role="img" aria-label="一台 iArm 的三条链：画面、输入、供电"><title>一台 iArm 的三条链：画面、输入、供电</title><defs><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><rect x="30" y="120" width="180" height="85" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="120.0" y="155.5" font-size="19" fill="#087e83" text-anchor="middle" font-weight="650">Mac / Python</text><text x="120.0" y="181.5" font-size="14" fill="#60737c" text-anchor="middle" font-weight="500">决策、记录、看画面</text><rect x="315" y="120" width="180" height="85" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="405.0" y="155.5" font-size="19" fill="#087e83" text-anchor="middle" font-weight="650">输入模块</text><text x="405.0" y="181.5" font-size="14" fill="#60737c" text-anchor="middle" font-weight="500">CH9329 或 ESP32</text><rect x="615" y="120" width="180" height="85" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="705.0" y="155.5" font-size="19" fill="#087e83" text-anchor="middle" font-weight="650">iPhone</text><text x="705.0" y="181.5" font-size="14" fill="#60737c" text-anchor="middle" font-weight="500">接收键盘 / 鼠标</text><path d="M210,163 L315,163" fill="none" stroke="#087e83" stroke-width="3"  marker-end="url(#arrow1)"/><text x="260" y="145" font-size="15" fill="#087e83" text-anchor="middle" font-weight="500">命令</text><path d="M495,163 L615,163" fill="none" stroke="#087e83" stroke-width="3"  marker-end="url(#arrow1)"/><text x="555" y="145" font-size="15" fill="#087e83" text-anchor="middle" font-weight="500">HID</text><rect x="315" y="10" width="180" height="65" rx="14" fill="white" stroke="#456bc0" stroke-width="2"/><text x="405.0" y="35.5" font-size="19" fill="#456bc0" text-anchor="middle" font-weight="650">外置摄像头</text><text x="405.0" y="61.5" font-size="14" fill="#60737c" text-anchor="middle" font-weight="500">拍摄手机屏幕</text><path d="M615,95 L495,43" fill="none" stroke="#456bc0" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow1)"/><path d="M315,43 L120,105" fill="none" stroke="#456bc0" stroke-width="3"  marker-end="url(#arrow1)"/><text x="200" y="48" font-size="15" fill="#456bc0" text-anchor="middle" font-weight="500">画面 →</text><rect x="315" y="255" width="180" height="60" rx="14" fill="white" stroke="#d6663c" stroke-width="2"/><text x="405.0" y="278.0" font-size="19" fill="#d6663c" text-anchor="middle" font-weight="650">供电与固定</text><text x="405.0" y="304.0" font-size="14" fill="#60737c" text-anchor="middle" font-weight="500">电源 / 线束 / 支架</text><path d="M405,255 L405,212" fill="none" stroke="#d6663c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow1)"/><text x="635" y="275" font-size="15" fill="#60737c" text-anchor="middle" font-weight="500">蓝：画面　绿：输入　橙：供电</text></svg>