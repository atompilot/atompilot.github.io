<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">控制信号，不是电机的电源</title><desc id="desc">原理示意。实际驱动、供电、电平、保护及电机规格按具体器件确认，不直接把电机挂到 GPIO。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">控制信号，不是电机的电源</text><rect x="20" y="100" width="144" height="80" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="92.0" y="135.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">GPIO</text><text x="92.0" y="165.0" fill="#60737c" font-size="17" font-weight="500" text-anchor="middle">控制信号</text><rect x="227" y="100" width="145" height="80" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="299.5" y="148.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">电机驱动</text><rect x="434" y="100" width="145" height="80" rx="13" fill="white" stroke="#087e83" stroke-width="2"/><text x="506.5" y="148.0" fill="#087e83" font-size="22" font-weight="650" text-anchor="middle">电机 / 舵机</text><path d="M169,140 L220,140" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><path d="M377,140 L427,140" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><rect x="227" y="239" width="145" height="66" rx="13" fill="white" stroke="#d6663c" stroke-width="2"/><text x="299.5" y="280.0" fill="#d6663c" font-size="22" font-weight="650" text-anchor="middle">匹配电源</text><path d="M300,234 L300,185" stroke="#d6663c" stroke-width="3" fill="none" marker-end="url(#arrow)"  /><text x="300" y="209" fill="#d6663c" font-size="19" font-weight="500" text-anchor="middle">功率由驱动与电源承担</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>