<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">位、字节与字符，是不同层次</title><desc id="desc">01000001 为 ASCII 字母 A 的示例。Unicode 为更多字符提供编号，但发送一个字符仍要选择相应编码或已验证输入通道。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="context-stroke"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="600" height="360" rx="14" fill="#f0f5ef"/><text x="24" y="37" fill="#203b46" font-size="25" font-weight="700" text-anchor="start">位、字节与字符，是不同层次</text><rect x="28" y="95" width="60" height="69" rx="5" fill="white" stroke="#087e83"/><text x="58" y="141" fill="#087e83" font-size="31" font-weight="500" text-anchor="middle">0</text><rect x="97" y="95" width="60" height="69" rx="5" fill="white" stroke="#087e83"/><text x="127" y="141" fill="#087e83" font-size="31" font-weight="500" text-anchor="middle">1</text><rect x="166" y="95" width="60" height="69" rx="5" fill="white" stroke="#087e83"/><text x="196" y="141" fill="#087e83" font-size="31" font-weight="500" text-anchor="middle">0</text><rect x="235" y="95" width="60" height="69" rx="5" fill="white" stroke="#087e83"/><text x="265" y="141" fill="#087e83" font-size="31" font-weight="500" text-anchor="middle">0</text><rect x="304" y="95" width="60" height="69" rx="5" fill="white" stroke="#087e83"/><text x="334" y="141" fill="#087e83" font-size="31" font-weight="500" text-anchor="middle">0</text><rect x="373" y="95" width="60" height="69" rx="5" fill="white" stroke="#087e83"/><text x="403" y="141" fill="#087e83" font-size="31" font-weight="500" text-anchor="middle">0</text><rect x="442" y="95" width="60" height="69" rx="5" fill="white" stroke="#087e83"/><text x="472" y="141" fill="#087e83" font-size="31" font-weight="500" text-anchor="middle">0</text><rect x="511" y="95" width="60" height="69" rx="5" fill="white" stroke="#087e83"/><text x="541" y="141" fill="#087e83" font-size="31" font-weight="500" text-anchor="middle">1</text><text x="300" y="222" fill="#087e83" font-size="26" font-weight="500" text-anchor="middle">8 位 → 1 字节 → ASCII 字母 A</text><text x="300" y="280" fill="#d6663c" font-size="22" font-weight="500" text-anchor="middle">字符编码不等于键盘按键报告</text><text x="24" y="344" fill="#60737c" font-size="14" font-weight="500" text-anchor="start">原创概念图 · 不表示具体板子的接线或实测结果</text></svg>