<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atom Wang 的公开交互式 HTML 报告库。" />
    <title>Reports — Atom Wang</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --ink: #17211c; --paper: #f6f4ee; --muted: #657069; --line: #d9dcd3; --accent: #d5ff56; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; color: var(--ink); background: var(--paper); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(960px, calc(100% - 40px)); margin: 0 auto; }
      nav, footer { display: flex; justify-content: space-between; padding: 25px 0; font-size: .9rem; }
      a { color: inherit; text-underline-offset: 4px; }
      .mark { display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid var(--ink); border-radius: 50%; font-size: .76rem; font-weight: 800; text-decoration: none; }
      header { padding: 100px 0 78px; border-bottom: 1px solid var(--line); }
      .eyebrow { margin: 0 0 14px; color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(3.8rem, 10vw, 8rem); letter-spacing: -.085em; line-height: .82; }
      .intro { max-width: 560px; margin: 26px 0 0; font-size: 1.2rem; line-height: 1.5; }
      section { padding: 60px 0 90px; }
      .report { display: block; padding: 28px; border: 1px solid var(--ink); background: var(--accent); text-decoration: none; transition: transform 160ms ease, box-shadow 160ms ease; }
      .report:hover { transform: translate(-3px, -3px); box-shadow: 7px 7px 0 var(--ink); }
      .meta { display: flex; justify-content: space-between; gap: 16px; color: #455148; font-size: .8rem; }
      h2 { margin: 48px 0 12px; font-size: clamp(2rem, 5vw, 3.6rem); letter-spacing: -.065em; line-height: .92; }
      .report p { max-width: 650px; margin: 0; line-height: 1.55; }
      .open { display: inline-block; margin-top: 32px; font-weight: 800; }
      footer { border-top: 1px solid var(--line); color: var(--muted); }
      @media (max-width: 560px) { main { width: min(100% - 32px, 960px); } header { padding: 70px 0 55px; } section { padding: 40px 0 65px; } .meta { flex-direction: column; gap: 5px; } }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a class="mark" href="/" aria-label="Atom Wang 首页">AW</a>
        <a href="https://github.com/atompilot" rel="noreferrer">GitHub ↗</a>
      </nav>
      <header>
        <p class="eyebrow">Atom Wang</p>
        <h1>Reports</h1>
        <p class="intro">适合在任何设备上阅读的公开交互式简报。每份报告均保留生成日期、数据来源与适用边界。</p>
      </header>
      <section aria-label="报告列表">
        <a class="report" href="/reports/2026/07/github-hot-projects/">
          <div class="meta"><span>2026-07-29</span><span>GitHub · 公开数据</span></div>
          <h2>GitHub 本月热门项目</h2>
          <p>23 个 GitHub Trending 月度项目的交互式快照，可按类别筛选或搜索，并明确区分近期热度与长期累计 star。</p>
          <span class="open">打开报告 →</span>
        </a>
      </section>
      <footer><span>Public report library</span><a href="/">返回首页</a></footer>
    </main>
  </body>
</html>
